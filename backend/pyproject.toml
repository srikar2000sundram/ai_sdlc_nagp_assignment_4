# Package metadata and run-time dependencies. Install everything for development with: pip install -e "backend[dev]"
[project]
name = "invoice-app"
version = "0.1.0"
description = "Invoice approval demo app (FastAPI port)"
requires-python = ">=3.10"
# What the app needs to run.
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

# Extras: `dev` for tests and mutation testing, `docs` for building the PDF documentation.
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "mutmut>=3"]
docs = ["markdown>=3.5", "pypdf>=4", "playwright>=1.45"]

# pytest settings.
[tool.pytest.ini_options]
# Lets tests import the app (src) and the shared fake repository (tests) without installing anything.
pythonpath = ["src", "tests"]
# Where pytest looks for tests.
testpaths = ["tests"]

[tool.mutmut]
# Mutation scope: the pure business rules. Run from the unit tests only (no web layer).
source_paths = ["src/invoice_app/domain"]
# Files that are not approval rules (or contain only declarations) are left out of mutation testing.
do_not_mutate = ["*/discount_calculator.py", "*/errors.py", "*/repository.py", "*/invoice_status.py", "*/__init__.py"]
# Only the domain unit tests are used to judge the domain code.
pytest_add_cli_args_test_selection = ["tests/test_approval_service.py", "tests/test_approval_policy.py"]
# mutmut works in a copy of the project; the tests folder must come along.
also_copy = ["tests"]
