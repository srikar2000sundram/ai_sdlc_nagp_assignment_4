<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><rect width="1600" height="600" fill="#ffffff"/><defs><marker id="head-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1e3f"/></marker><marker id="head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7f7a"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4452f"/></marker><marker id="head-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6b7c"/></marker><marker id="head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6a00"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1e3f" flood-opacity="0.10"/></filter></defs><rect x="30" y="10" width="1540" height="330" rx="18" fill="#eef3f9" stroke="#b9c6d5" stroke-width="1.6"/><text x="48" y="34" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5d6b7c" text-anchor="start"><tspan x="48" dy="0">HOOKS: RUN AUTOMATICALLY ON EVERY CLAUDE CODE EVENT (.CLAUDE/SETTINGS.JSON)</tspan></text><rect x="50" y="46" width="300" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="64" y="71" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="64" dy="0">log_event.py</tspan></text><text x="64" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="64" dy="0">Prompt, tool use, sub-agent</tspan><tspan x="64" dy="19.8">stop, session stop:</tspan><tspan x="64" dy="19.8">one JSON line, 27 fixed</tspan><tspan x="64" dy="19.8">keys per event</tspan></text><rect x="368" y="46" width="300" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="382" y="71" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="382" dy="0">check_summary.py</tspan></text><text x="382" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="382" dy="0">After shell commands:</tspan><tspan x="382" dy="19.8">pytest, mutmut, Playwright</tspan><tspan x="382" dy="19.8">become CHECK name | metrics</tspan><tspan x="382" dy="19.8">| result=pass/fail</tspan></text><rect x="686" y="46" width="300" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="700" y="71" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="700" dy="0">validate_review.py</tspan></text><text x="700" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="700" dy="0">When a sub-agent stops:</tspan><tspan x="700" dy="19.8">blocks a pr-reviewer answer</tspan><tspan x="700" dy="19.8">that is not the findings</tspan><tspan x="700" dy="19.8">JSON schema</tspan></text><polyline points="984,140 1010,140" fill="none" stroke="#0b7f7a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-teal)"/><rect x="1014" y="46" width="270" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="1028" y="71" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="1028" dy="0">logs/ai-interactions.jsonl</tspan></text><text x="1028" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="1028" dy="0">Append-only: prompt, tools,</tspan><tspan x="1028" dy="18.5">sub-agents, AI suggestion,</tspan><tspan x="1028" dy="18.5">human decision, verification,</tspan><tspan x="1028" dy="18.5">status, files</tspan></text><polyline points="1286,140 1310,140" fill="none" stroke="#0b7f7a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-teal)"/><rect x="1314" y="46" width="240" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="1328" y="71" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="1328" dy="0">summarize_log.py</tspan></text><text x="1328" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="1328" dy="0">Validates every line and</tspan><tspan x="1328" dy="18.5">writes the readable</tspan><tspan x="1328" dy="18.5">summary, counting prompts</tspan><tspan x="1328" dy="18.5">and human decisions</tspan></text><text x="50" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="50" dy="0">Secrets, local paths and the account name are removed before a line is written. A hook never fails a session.</tspan></text><text x="50" y="300" font-family="Consolas, 'Courier New', monospace" font-size="14.5" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="50" dy="0">Human corrections are recorded too:  python .claude/hooks/log_event.py --human "what I decided"</tspan></text><rect x="30" y="360" width="1540" height="230" rx="18" fill="#f4f7fb" stroke="#b9c6d5" stroke-width="1.6"/><text x="48" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5d6b7c" text-anchor="start"><tspan x="48" dy="0">AGENTS (.CLAUDE/AGENTS)  AND SKILLS (.CLAUDE/SKILLS)</tspan></text><rect x="50" y="400" width="286" height="168" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="64" y="425" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="64" dy="0">spec-writer</tspan></text><text x="64" y="450" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="64" dy="0">read, write</tspan><tspan x="64" dy="19.8">writes Spec Kit files only</tspan></text><rect x="352" y="400" width="286" height="168" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="366" y="425" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="366" dy="0">implementer</tspan></text><text x="366" y="450" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="366" dy="0">read, write, shell</tspan><tspan x="366" dy="19.8">one task group at a time</tspan></text><rect x="654" y="400" width="286" height="168" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="668" y="425" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="668" dy="0">test-reviewer</tspan></text><text x="668" y="450" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="668" dy="0">read-only</tspan><tspan x="668" dy="19.8">finds tests that cannot fail</tspan></text><rect x="956" y="400" width="286" height="168" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="970" y="425" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="970" dy="0">pr-reviewer</tspan></text><text x="970" y="450" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="970" dy="0">read-only</tspan><tspan x="970" dy="19.8">answers in findings JSON only</tspan></text><rect x="1258" y="400" width="286" height="168" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="1272" y="425" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="1272" dy="0">mutation-analyst</tspan></text><text x="1272" y="450" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="1272" dy="0">read-only</tspan><tspan x="1272" dy="19.8">survivors to missing tests</tspan></text></svg>