<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><rect width="1600" height="860" fill="#ffffff"/><defs><marker id="head-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1e3f"/></marker><marker id="head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7f7a"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4452f"/></marker><marker id="head-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6b7c"/></marker><marker id="head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6a00"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1e3f" flood-opacity="0.10"/></filter></defs><rect x="20" y="16" width="1560" height="408" rx="18" fill="#eef3f9" stroke="#b9c6d5" stroke-width="1.6"/><text x="38" y="40" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5d6b7c" text-anchor="start"><tspan x="38" dy="0">ABOVE 500,000.00: TWO DIFFERENT APPROVERS</tspan></text><polygon points="330,105.0 540.0,190 330,275.0 120.0,190" fill="#fff4d6" stroke="#9a6a00" stroke-width="1.8"/><text x="330" y="174.48" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#1b2638" text-anchor="middle"><tspan x="330" dy="0">Has this same user</tspan><tspan x="330" dy="21.1">already approved it?</tspan><tspan x="330" dy="21.1">(trim spaces, ignore case)</tspan></text><polyline points="330,275 330,316" fill="none" stroke="#b4452f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-red)"/><text x="356" y="302" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#b4452f" text-anchor="middle"><tspan x="356" dy="0">yes</tspan></text><rect x="100" y="316" width="460" height="98" rx="10" fill="#fdebe7" stroke="#b4452f" stroke-width="1.5"/><text x="116" y="342" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="116" dy="0">403  Dir.One has already approved this</tspan><tspan x="116" dy="18.5">invoice; invoices above 500,000.00 need</tspan><tspan x="116" dy="18.5">two different approvers.</tspan></text><polyline points="540,190 640,190" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="590" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="590" dy="0">no</tspan></text><polygon points="850,105.0 1070.0,190 850,275.0 630.0,190" fill="#fff4d6" stroke="#9a6a00" stroke-width="1.8"/><text x="850" y="174.48" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#1b2638" text-anchor="middle"><tspan x="850" dy="0">Is it the second approval and</tspan><tspan x="850" dy="21.1">the approver is not</tspan><tspan x="850" dy="21.1">a Director?</tspan></text><polyline points="850,275 850,316" fill="none" stroke="#b4452f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-red)"/><text x="876" y="302" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#b4452f" text-anchor="middle"><tspan x="876" dy="0">yes</tspan></text><rect x="620" y="316" width="460" height="98" rx="10" fill="#fdebe7" stroke="#b4452f" stroke-width="1.5"/><text x="636" y="342" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="636" dy="0">403  The second approver on an invoice</tspan><tspan x="636" dy="18.5">above 500,000.00 must be a Director;</tspan><tspan x="636" dy="18.5">demo.manager is a Manager.</tspan></text><polyline points="1070,190 1170,190" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="1120" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="1120" dy="0">no</tspan></text><rect x="1170" y="120" width="390" height="150" rx="12" fill="#e3f4f1" stroke="#0b7f7a" stroke-width="1.5"/><text x="1190" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0b7f7a" text-anchor="start"><tspan x="1190" dy="0">Record the approval</tspan></text><text x="1190" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1b2638" text-anchor="start"><tspan x="1190" dy="0">First of two: the invoice stays</tspan><tspan x="1190" dy="19.1">Pending ("1 of 2 approvals").</tspan><tspan x="1190" dy="19.1">Second: status Approved.</tspan></text><rect x="20" y="444" width="1560" height="330" rx="18" fill="#eef3f9" stroke="#b9c6d5" stroke-width="1.6"/><text x="38" y="468" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5d6b7c" text-anchor="start"><tspan x="38" dy="0">UP TO 500,000.00: ONE APPROVER IS ENOUGH</tspan></text><polygon points="400,525.0 650.0,610 400,695.0 150.0,610" fill="#fff4d6" stroke="#9a6a00" stroke-width="1.8"/><text x="400" y="605.0400000000001" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#1b2638" text-anchor="middle"><tspan x="400" dy="0">Is A above 50,000.00 and the</tspan><tspan x="400" dy="21.1">approver is not a Director?</tspan></text><polyline points="650,610 760,610" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="705" y="598" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="705" dy="0">yes</tspan></text><rect x="760" y="548" width="450" height="124" rx="10" fill="#fdebe7" stroke="#b4452f" stroke-width="1.5"/><text x="776" y="578" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="776" dy="0">403  A Manager may approve invoices up to</tspan><tspan x="776" dy="18.5">50,000.00; this invoice is 75,000.00 and</tspan><tspan x="776" dy="18.5">needs a Director.</tspan></text><polyline points="400,695 400,728 1300,728 1300,690" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="850" y="718" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="850" dy="0">no</tspan></text><rect x="1230" y="520" width="330" height="170" rx="12" fill="#e3f4f1" stroke="#0b7f7a" stroke-width="1.5"/><text x="1250" y="552" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#0b7f7a" text-anchor="start"><tspan x="1250" dy="0">Record the approval</tspan></text><text x="1250" y="582" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1b2638" text-anchor="start"><tspan x="1250" dy="0">One approval is enough:</tspan><tspan x="1250" dy="19.1">status Approved ("1 of 1").</tspan></text><text x="20" y="812" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="20" dy="0">Rule order: role, Manager limit, "same user", "second must be a Director". The first objection wins and its text is the reason shown.</tspan></text><text x="20" y="838" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="20" dy="0">Limits are inclusive: 50,000.00 and 500,000.00 are inside their band; one cent more moves to the next band.</tspan></text></svg>