<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><rect width="1600" height="860" fill="#ffffff"/><defs><marker id="head-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1e3f"/></marker><marker id="head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7f7a"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4452f"/></marker><marker id="head-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6b7c"/></marker><marker id="head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6a00"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1e3f" flood-opacity="0.10"/></filter></defs><rect x="30" y="22" width="130" height="38" rx="19.0" fill="#0b7f7a"/><text x="95.0" y="46.6" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan x="95.0" dy="0">Manager</tspan></text><rect x="30" y="68" width="130" height="38" rx="19.0" fill="#0b7f7a"/><text x="95.0" y="92.6" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan x="95.0" dy="0">Director</tspan></text><rect x="30" y="114" width="130" height="38" rx="19.0" fill="#0b7f7a"/><text x="95.0" y="138.6" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan x="95.0" dy="0">Admin</tspan></text><polyline points="166,80 210,80" fill="none" stroke="#5d6b7c" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-grey)"/><rect x="220" y="20" width="820" height="136" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="234" y="45" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="234" dy="0">Browser: static web UI (wwwroot)</tspan></text><text x="234" y="70" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="234" dy="0">index.html: sign-in, Invoices tab, Approvals tab.   styles.css: design tokens, status pills.</tspan><tspan x="234" dy="19.8">app.js: plain JavaScript, no build step. Sends the session token as Authorization: Bearer</tspan><tspan x="234" dy="19.8">and shows the refusal reason, the rejection reason and "N of M approvals".</tspan></text><rect x="1090" y="20" width="480" height="136" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="1104" y="45" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="1104" dy="0">Playwright end-to-end test</tspan></text><text x="1104" y="70" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="1104" dy="0">Page objects, role-based locators.</tspan><tspan x="1104" dy="19.8">Drives this same UI on port 5000 and</tspan><tspan x="1104" dy="19.8">checks the exact refusal text.</tspan></text><polyline points="1090,88 1042,88" fill="none" stroke="#5d6b7c" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-grey)"/><text x="1066" y="76" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#5d6b7c" text-anchor="middle"><tspan x="1066" dy="0">drives</tspan></text><polyline points="630,156 630,206" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="760" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="760" dy="0">HTTP + JSON, Bearer token</tspan></text><rect x="30" y="206" width="1540" height="244" rx="18" fill="#f4f7fb" stroke="#b9c6d5" stroke-width="1.6"/><text x="48" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5d6b7c" text-anchor="start"><tspan x="48" dy="0">API/  THE WEB LAYER (FASTAPI)</tspan></text><rect x="50" y="244" width="290" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="64" y="269" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="64" dy="0">main.py</tspan></text><text x="64" y="293" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="64" dy="0">create_app(repository,</tspan><tspan x="64" dy="18.5">users, policy):</tspan><tspan x="64" dy="18.5">the composition root; the</tspan><tspan x="64" dy="18.5">only place that picks</tspan><tspan x="64" dy="18.5">concrete classes</tspan></text><rect x="353" y="244" width="290" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="367" y="269" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="367" dy="0">auth/middleware.py</tspan></text><text x="367" y="293" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="367" dy="0">Session check: no valid</tspan><tspan x="367" dy="18.5">token means 401, before</tspan><tspan x="367" dy="18.5">any router runs</tspan></text><rect x="656" y="244" width="290" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="670" y="269" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="670" dy="0">routers/</tspan></text><text x="670" y="293" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="670" dy="0">auth: login, logout</tspan><tspan x="670" dy="18.5">invoices: list, get, create,</tspan><tspan x="670" dy="18.5">submit, delete (Admin)</tspan><tspan x="670" dy="18.5">approvals: approve, reject</tspan></text><rect x="959" y="244" width="290" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="973" y="269" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="973" dy="0">error_handling.py</tspan></text><text x="973" y="293" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="973" dy="0">Domain error to HTTP:</tspan><tspan x="973" dy="18.5">not found 404, wrong state</tspan><tspan x="973" dy="18.5">409, not permitted 403,</tspan><tspan x="973" dy="18.5">bad input 400, other 500</tspan></text><rect x="1262" y="244" width="290" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="1276" y="269" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="1276" dy="0">serialization.py</tspan><tspan x="1276" dy="19.8">static_ui.py</tspan></text><text x="1276" y="313" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="1276" dy="0">Invoice to camelCase JSON;</tspan><tspan x="1276" dy="18.5">UI served with no-cache</tspan></text><polyline points="630,450 630,494" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="960" y="478" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="960" dy="0">routers call the domain; no rules in the web layer</tspan></text><rect x="30" y="494" width="1540" height="244" rx="18" fill="#eefaf8" stroke="#9ed8d1" stroke-width="1.6"/><text x="48" y="518" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#0b7f7a" text-anchor="start"><tspan x="48" dy="0">DOMAIN/  BUSINESS RULES: NO WEB CODE, NO STORAGE CODE</tspan></text><rect x="50" y="532" width="320" height="192" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="64" y="557" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="64" dy="0">approval_service.py</tspan></text><text x="64" y="581" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="64" dy="0">ApprovalService:</tspan><tspan x="64" dy="18.5">submit, approve, reject.</tspan><tspan x="64" dy="18.5">One lock; every check runs</tspan><tspan x="64" dy="18.5">before the first change</tspan></text><rect x="390" y="532" width="430" height="192" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="404" y="557" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="404" dy="0">approval_policy.py</tspan></text><text x="404" y="581" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="404" dy="0">ApprovalPolicy asks the rules</tspan><tspan x="404" dy="18.5">in order; first objection wins:</tspan><tspan x="404" dy="18.5">1 ApproverRoleRule</tspan><tspan x="404" dy="18.5">2 ManagerLimitRule</tspan><tspan x="404" dy="18.5">3 DistinctApproversRule</tspan><tspan x="404" dy="18.5">4 SecondApproverMustBeDirector</tspan></text><rect x="840" y="532" width="320" height="192" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="854" y="557" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="854" dy="0">repository.py</tspan></text><text x="854" y="581" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="854" dy="0">Contracts (Protocols):</tspan><tspan x="854" dy="18.5">ApprovalStore, InvoiceReader,</tspan><tspan x="854" dy="18.5">InvoiceWriter,</tspan><tspan x="854" dy="18.5">InvoiceRepository</tspan></text><rect x="1180" y="532" width="330" height="192" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="1194" y="557" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="1194" dy="0">invoice.py, approval.py</tspan><tspan x="1194" dy="19.8">errors.py</tspan></text><text x="1194" y="601" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="1194" dy="0">Invoice (with ordered</tspan><tspan x="1194" dy="18.5">approvals), Approver,</tspan><tspan x="1194" dy="18.5">ApprovalRecord, status;</tspan><tspan x="1194" dy="18.5">four domain errors. Money</tspan><tspan x="1194" dy="18.5">is Decimal, never float</tspan></text><rect x="30" y="770" width="1540" height="76" rx="14" fill="#eef3f9" stroke="#aebbcc" stroke-width="1.5" stroke-dasharray="7 5"/><text x="48" y="800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#5d6b7c" text-anchor="start"><tspan x="48" dy="0">CONCRETE PARTS THE DEMO USES</tspan><tspan x="48" dy="16.5">(chosen in create_app)</tspan></text><rect x="330" y="782" width="392" height="52" rx="10" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5"/><text x="344" y="805" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="344" dy="0">in_memory_repository</tspan></text><text x="344" y="825" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="344" dy="0">thread-safe, seeded invoices</tspan></text><rect x="740" y="782" width="392" height="52" rx="10" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5"/><text x="754" y="805" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="754" dy="0">session_store</tspan></text><text x="754" y="825" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="754" dy="0">tokens in memory</tspan></text><rect x="1150" y="782" width="392" height="52" rx="10" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5"/><text x="1164" y="805" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="1164" dy="0">user_directory</tspan></text><text x="1164" y="825" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="1164" dy="0">four demo accounts</tspan></text><polyline points="960,770 960,726" fill="none" stroke="#0b7f7a" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#head-teal)"/><text x="1112" y="752" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b7f7a" text-anchor="middle"><tspan x="1112" dy="0">implement the contracts</tspan></text></svg>