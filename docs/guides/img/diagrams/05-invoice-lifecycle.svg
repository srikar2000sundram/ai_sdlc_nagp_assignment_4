<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><rect width="1600" height="560" fill="#ffffff"/><defs><marker id="head-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1e3f"/></marker><marker id="head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7f7a"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4452f"/></marker><marker id="head-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6b7c"/></marker><marker id="head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6a00"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1e3f" flood-opacity="0.10"/></filter></defs><rect x="60" y="200" width="300" height="110" rx="18" fill="#eef1f5" stroke="#5d6b7c" stroke-width="2.4" filter="url(#shadow)"/><text x="210" y="266" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#5d6b7c" text-anchor="middle"><tspan x="210" dy="0">Draft</tspan></text><rect x="500" y="200" width="340" height="110" rx="18" fill="#fff4d6" stroke="#9a6a00" stroke-width="2.4" filter="url(#shadow)"/><text x="670" y="266" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#9a6a00" text-anchor="middle"><tspan x="670" dy="0">PendingApproval</tspan></text><rect x="1080" y="70" width="300" height="110" rx="18" fill="#e3f4f1" stroke="#0b7f7a" stroke-width="2.4" filter="url(#shadow)"/><text x="1230" y="136" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#0b7f7a" text-anchor="middle"><tspan x="1230" dy="0">Approved</tspan></text><rect x="1080" y="330" width="300" height="110" rx="18" fill="#fdebe7" stroke="#b4452f" stroke-width="2.4" filter="url(#shadow)"/><text x="1230" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#b4452f" text-anchor="middle"><tspan x="1230" dy="0">Rejected</tspan></text><rect x="60" y="100" width="150" height="36" rx="18.0" fill="#0b1e3f"/><text x="135.0" y="122.9" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan x="135.0" dy="0">Create invoice</tspan></text><polyline points="135,136 135,198" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><polyline points="360,255 498,255" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="430" y="244" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="430" dy="0">submit</tspan></text><polyline points="840,232 960,232 960,125 1078,125" fill="none" stroke="#0b7f7a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-teal)"/><text x="960" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0b7f7a" text-anchor="middle"><tspan x="960" dy="0">approve: required count reached</tspan></text><polyline points="840,278 960,278 960,385 1078,385" fill="none" stroke="#b4452f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-red)"/><text x="1019" y="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#b4452f" text-anchor="middle"><tspan x="1019" dy="0">reject with a reason</tspan></text><path d="M 560 198 C 540 120, 800 120, 780 198" fill="none" stroke="#9a6a00" stroke-width="2.4" marker-end="url(#head-amber)"/><text x="670" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#9a6a00" text-anchor="middle"><tspan x="670" dy="0">approve, but more are needed ("1 of 2 approvals")</tspan></text><rect x="60" y="460" width="1480" height="76" rx="12" fill="#e6f6f4" stroke="#9ed8d1" stroke-width="1.5"/><text x="80" y="490" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b7f7a" text-anchor="start"><tspan x="80" dy="0">A refused approval (403) is not a transition: the invoice stays in the same state with the same approvals.</tspan></text><text x="80" y="516" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="80" dy="0">Wrong state (for example approving an already Approved invoice) is a 409; an unknown id is a 404. Admin can also delete an invoice.</tspan></text><text x="1230" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6b7c" text-anchor="middle"><tspan x="1230" dy="0">decided_by and decided_at are set only by the</tspan><tspan x="1230" dy="16.5">final approval or by a rejection</tspan></text></svg>