<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740"><rect width="1600" height="740" fill="#ffffff"/><defs><marker id="head-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1e3f"/></marker><marker id="head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7f7a"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4452f"/></marker><marker id="head-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6b7c"/></marker><marker id="head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6a00"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1e3f" flood-opacity="0.10"/></filter></defs><rect x="420.0" y="40" width="520" height="118" rx="14" fill="#13315f"/><text x="680" y="80" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="680" dy="0">Browser test (Playwright)</tspan></text><text x="680" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#d7f5f0" text-anchor="middle"><tspan x="680" dy="0">1 test</tspan></text><text x="680" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle"><tspan x="680" dy="0">Manager is refused on a 75,000.00 invoice;</tspan><tspan x="680" dy="16.5">the exact reason is shown; the invoice stays pending</tspan></text><rect x="300.0" y="172" width="760" height="118" rx="14" fill="#0b7f7a"/><text x="680" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="680" dy="0">API tests</tspan></text><text x="680" y="238" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#d7f5f0" text-anchor="middle"><tspan x="680" dy="0">36 tests</tspan></text><text x="680" y="264" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle"><tspan x="680" dy="0">Status codes, JSON shape, sign-in, roles, amount validation, double-click</tspan></text><rect x="180.0" y="304" width="1000" height="118" rx="14" fill="#0f8f84"/><text x="680" y="344" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="680" dy="0">Service tests + repository contract</tspan></text><text x="680" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#d7f5f0" text-anchor="middle"><tspan x="680" dy="0">62 + 16 tests</tspan></text><text x="680" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle"><tspan x="680" dy="0">Lifecycle, "unchanged after a refusal", saved once, concurrency, fake equals real</tspan></text><rect x="60.0" y="436" width="1240" height="118" rx="14" fill="#1aa89b"/><text x="680" y="476" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="680" dy="0">Policy tests</tspan></text><text x="680" y="502" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#d7f5f0" text-anchor="middle"><tspan x="680" dy="0">63 tests</tspan></text><text x="680" y="528" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle"><tspan x="680" dy="0">Every rule, one cent either side of 50,000.00 and 500,000.00, the two negative rules</tspan></text><rect x="1330" y="40" width="240" height="215" rx="12" fill="#e6f6f4" stroke="#9ed8d1" stroke-width="1.5" filter="url(#shadow)"/><text x="1344" y="65" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="1344" dy="0">Mutation testing</tspan></text><text x="1344" y="88" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="1344" dy="0">mutmut changes the code</tspan><tspan x="1344" dy="17.8">on purpose and checks a</tspan><tspan x="1344" dy="17.8">test fails.</tspan><tspan x="1344" dy="17.8"> </tspan><tspan x="1344" dy="17.8">Before: 63.9%  (23/36)</tspan><tspan x="1344" dy="17.8">After:  100%  (132/132)</tspan></text><rect x="1330" y="275" width="240" height="190" rx="12" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5" filter="url(#shadow)"/><text x="1344" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b1e3f" text-anchor="start"><tspan x="1344" dy="0">Hook tests</tspan></text><text x="1344" y="323" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1b2638" text-anchor="start"><tspan x="1344" dy="0">10 tests in</tspan><tspan x="1344" dy="17.8">.claude/hooks that prove</tspan><tspan x="1344" dy="17.8">the logger redacts secrets,</tspan><tspan x="1344" dy="17.8">keeps 27 keys and survives</tspan><tspan x="1344" dy="17.8">bad input.</tspan></text><rect x="1330" y="485" width="240" height="130" rx="12" fill="#0b1e3f" stroke="#0b1e3f" stroke-width="1.5" filter="url(#shadow)"/><text x="1344" y="510" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#4be3d2" text-anchor="start"><tspan x="1344" dy="0">Total</tspan></text><text x="1344" y="534" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="1344" dy="0">177 backend tests</tspan><tspan x="1344" dy="18.5">10 hook tests</tspan><tspan x="1344" dy="18.5">1 browser test</tspan></text><text x="40" y="590" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="40" dy="0">Each refusal test asserts the reason text, deep-compares the invoice before and after,</tspan></text><text x="40" y="612" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="40" dy="0">and checks the repository saw no update. A test that only checks the exception type does not count.</tspan></text></svg>