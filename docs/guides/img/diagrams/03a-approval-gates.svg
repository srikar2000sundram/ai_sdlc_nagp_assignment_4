<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470"><rect width="1600" height="470" fill="#ffffff"/><defs><marker id="head-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1e3f"/></marker><marker id="head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7f7a"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4452f"/></marker><marker id="head-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6b7c"/></marker><marker id="head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6a00"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1e3f" flood-opacity="0.10"/></filter></defs><rect x="20" y="130" width="250" height="100" rx="16" fill="#0b1e3f"/><text x="145" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="145" dy="0">Someone presses</tspan><tspan x="145" dy="21.1">Approve on an invoice</tspan><tspan x="145" dy="21.1">of amount A</tspan></text><polyline points="270,180 350,180" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><polygon points="520,100.0 690.0,180 520,260.0 350.0,180" fill="#fff4d6" stroke="#9a6a00" stroke-width="1.8"/><text x="520" y="174.73" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2638" text-anchor="middle"><tspan x="520" dy="0">Is the invoice</tspan><tspan x="520" dy="22.4">PendingApproval?</tspan></text><polyline points="690,180 730,180" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="710" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="710" dy="0">yes</tspan></text><polygon points="900,100.0 1070.0,180 900,260.0 730.0,180" fill="#fff4d6" stroke="#9a6a00" stroke-width="1.8"/><text x="900" y="174.73" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2638" text-anchor="middle"><tspan x="900" dy="0">Is the approver a</tspan><tspan x="900" dy="22.4">Manager or Director?</tspan></text><polyline points="1070,180 1150,180" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="1110" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="1110" dy="0">yes</tspan></text><polygon points="1360,100.0 1560.0,180 1360,260.0 1160.0,180" fill="#fff4d6" stroke="#9a6a00" stroke-width="1.8"/><text x="1360" y="174.73" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2638" text-anchor="middle"><tspan x="1360" dy="0">Is the amount A</tspan><tspan x="1360" dy="22.4">above 500,000.00 ?</tspan></text><polyline points="520,260 520,316" fill="none" stroke="#b4452f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-red)"/><text x="542" y="292" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#b4452f" text-anchor="middle"><tspan x="542" dy="0">no</tspan></text><rect x="360" y="316" width="320" height="92" rx="10" fill="#fdebe7" stroke="#b4452f" stroke-width="1.5"/><text x="376" y="346" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="376" dy="0">409  Only pending invoices</tspan><tspan x="376" dy="19.8">can be decided.</tspan></text><text x="376" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="376" dy="0">(404 first for an unknown id)</tspan></text><polyline points="900,260 900,316" fill="none" stroke="#b4452f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-red)"/><text x="922" y="292" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#b4452f" text-anchor="middle"><tspan x="922" dy="0">no</tspan></text><rect x="740" y="316" width="320" height="92" rx="10" fill="#fdebe7" stroke="#b4452f" stroke-width="1.5"/><text x="756" y="346" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="756" dy="0">403  Role Admin is not</tspan><tspan x="756" dy="19.8">allowed to approve invoices.</tspan></text><polyline points="1260,220 1260,316" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="1286" y="284" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="1286" dy="0">yes</tspan></text><polyline points="1470,220 1470,316" fill="none" stroke="#0b1e3f" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-navy)"/><text x="1494" y="284" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0b1e3f" text-anchor="middle"><tspan x="1494" dy="0">no</tspan></text><rect x="1130" y="316" width="260" height="44" rx="22.0" fill="#13315f"/><text x="1260.0" y="343.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan x="1260.0" dy="0">two approvers needed</tspan></text><rect x="1400" y="316" width="180" height="44" rx="22.0" fill="#13315f"/><text x="1490.0" y="343.25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan x="1490.0" dy="0">one approver</tspan></text><text x="1260" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6b7c" text-anchor="middle"><tspan x="1260" dy="0">see the next diagram</tspan></text><text x="1490" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5d6b7c" text-anchor="middle"><tspan x="1490" dy="0">see the next diagram</tspan></text><rect x="20" y="428" width="1560" height="34" rx="10" fill="#e6f6f4" stroke="#9ed8d1" stroke-width="1.5"/><text x="36" y="451" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b7f7a" text-anchor="start"><tspan x="36" dy="0">Every refusal is decided before anything is changed: the invoice stays exactly as it was.</tspan></text></svg>