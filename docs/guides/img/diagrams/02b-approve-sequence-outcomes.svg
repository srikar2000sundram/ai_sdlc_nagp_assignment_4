tart"><tspan x="80" dy="0">ALLOWED  (no reason)</tspan></text><text x="80" y="482" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1b2638" text-anchor="start"><tspan x="80" dy="0">add an ApprovalRecord. When approvals reach the</tspan><tspan x="80" dy="19.1">required count (1, or 2 above 500,000.00):</tspan><tspan x="80" dy="19.1">status Approved, decided_by and decided_at set.</tspan></text><polyline points="880,528 1400,528" fill="none" stroke="#0b7f7a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-teal)"/><text x="1140.0" y="518" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0b7f7a" text-anchor="middle"><tspan x="1140.0" dy="0">update(invoice)</tspan></text><polyline points="880,590 620,590" fill="none" stroke="#0b7f7a" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#head-teal)"/><text x="750.0" y="580" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0b7f7a" text-anchor="middle"><tspan x="750.0" dy="0">the invoice</tspan></text><polyline points="620,650 120,650" fill="none" stroke="#0b7f7a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head-teal)"/><text x="370.0" y="640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0b7f7a" text-anchor="middle"><tspan x="370.0" dy="0">200  invoice JSON (requiredApprovals, approvals)</tspan></text></svg>