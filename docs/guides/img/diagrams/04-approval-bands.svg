a Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="522" dy="0">50,000.01  in the next band</tspan></text><line x1="980" y1="60" x2="980" y2="244" stroke="#0b1e3f" stroke-width="2.4" stroke-dasharray="5 4"/><text x="968" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0b1e3f" text-anchor="end"><tspan x="968" dy="0">500,000.00  in the lower band</tspan></text><text x="992" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="992" dy="0">500,000.01  in the next band</tspan></text><text x="800" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#5d6b7c" text-anchor="middle"><tspan x="800" dy="0">Limits are inclusive. The tests try one cent either side of both limits.</tspan></text><rect x="40" y="310" width="1540" height="62" rx="12" fill="#0b1e3f"/><text x="58" y="348" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="58" dy="0"> </tspan></text><text x="278" y="348" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="278" dy="0">Up to 50,000.00</tspan></text><text x="678" y="348" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="678" dy="0">50,000.01 to 500,000.00</tspan></text><text x="1138" y="348" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="1138" dy="0">Above 500,000.00</tspan></text><rect x="40" y="378" width="1540" height="56" rx="10" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5"/><text x="58" y="414" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0b1e3f" text-anchor="start"><tspan x="58" dy="0">Manager</tspan></text><text x="278" y="414" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b7f7a" text-anchor="start"><tspan x="278" dy="0">approves</tspan></text><text x="678" y="414" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="678" dy="0">refused: needs a Director</tspan></text><text x="1138" y="414" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#9a6a00" text-anchor="start"><tspan x="1138" dy="0">may be the FIRST approver only</tspan></text><rect x="40" y="440" width="1540" height="56" rx="10" fill="#f4f7fb" stroke="#d3dce6" stroke-width="1.5"/><text x="58" y="476" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0b1e3f" text-anchor="start"><tspan x="58" dy="0">Director</tspan></text><text x="278" y="476" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b7f7a" text-anchor="start"><tspan x="278" dy="0">approves</tspan></text><text x="678" y="476" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b7f7a" text-anchor="start"><tspan x="678" dy="0">approves</tspan></text><text x="1138" y="476" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0b7f7a" text-anchor="start"><tspan x="1138" dy="0">first or second approver</tspan></text><rect x="40" y="502" width="1540" height="56" rx="10" fill="#ffffff" stroke="#d3dce6" stroke-width="1.5"/><text x="58" y="538" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0b1e3f" text-anchor="start"><tspan x="58" dy="0">Admin</tspan></text><text x="278" y="538" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="278" dy="0">never approves</tspan></text><text x="678" y="538" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="678" dy="0">never approves</tspan></text><text x="1138" y="538" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#b4452f" text-anchor="start"><tspan x="1138" dy="0">never approves</tspan></text><text x="40" y="598" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6b7c" text-anchor="start"><tspan x="40" dy="0">Above 500,000.00 the same user can never count twice (names compared after trim and ignoring case), and a refused attempt changes nothing.</tspan></text></svg>