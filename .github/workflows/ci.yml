# Continuous integration: runs on every push and pull request to main.
# Three jobs: unit tests, mutation tests, and the Playwright end-to-end test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fast checks first; the slower jobs only start once the unit tests pass.
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "backend[dev]"
      - run: python -m pytest backend/tests -q

  # Mutation testing: scripts/run_mutation.sh changes the domain code in small ways and checks the tests notice.
  # The report is saved as a build artifact.
  mutation-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/run_mutation.sh ci
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: docs/mutation/ci.txt

  # End-to-end: installs Chromium and runs the Playwright test (it starts the app itself).
  e2e:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -e "backend[dev]"
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
